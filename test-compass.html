<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIVOT: compass and synapse</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Spectral:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;background:#F7F1E3}
canvas{position:fixed;inset:0;display:block}
.titles{position:fixed;left:0;right:0;bottom:7vh;text-align:center;pointer-events:none}
.titles>*{opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s ease}
.on>*{opacity:1;transform:none}.on .sub{transition-delay:.3s}.on .by{transition-delay:.55s}.on .fc{transition-delay:.75s}
.pivot{font-family:Spectral,Georgia,serif;font-weight:300;font-size:clamp(56px,9vw,124px);letter-spacing:.16em;padding-left:.16em;line-height:1;margin:0;background:linear-gradient(100deg,#7A4E0E,#C8901F 35%,#E9B949 50%,#A86E14 70%,#7A4E0E);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:300;color:#1A2A5C;font-size:clamp(18px,2vw,26px);margin:.5em 0 .4em}
.by{color:#3A4670;font-size:15px;letter-spacing:.05em;margin:0}
.fc{color:#A86E14;font-size:12px;letter-spacing:.3em;margin:.8em 0 0}
nav{position:fixed;top:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:5}
nav button{font:500 14px "Hanken Grotesk",sans-serif;color:#1A2A5C;background:rgba(255,255,255,.7);border:1px solid rgba(168,110,20,.5);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button.sel{background:#C8901F;color:#fff;border-color:#C8901F}
</style></head><body>
<canvas id="cv"></canvas>
<div class="titles" id="titles"><h1 class="pivot">PIVOT</h1><p class="sub">The Art of Moving Beyond Our Familiar Selves</p><p class="by">By Rebecca A. Tavangar</p><p class="fc">FORTHCOMING 2027</p></div>
<nav><button data-s="0" data-d="0">Compass, light</button><button data-s="0" data-d="1">Compass, dusk to dawn</button><button data-s="1" data-d="0">Synapse, light</button><button data-s="1" data-d="1">Synapse, dusk to dawn</button><button data-r="1">Replay</button></nav>
<script>
var SPEEDS=[2.2,1.6],lastMove=0;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),titles=document.getElementById('titles'),W,H,scene=0,dawn=0,t0=null,last=0,mx=null,my=null,st={};
function sm(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u);}
function mixc(a,b,k){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*k)+','+Math.round(a[1]+(b[1]-a[1])*k)+','+Math.round(a[2]+(b[2]-a[2])*k)+')';}
function mixa(a,b,k,al){return 'rgba('+Math.round(a[0]+(b[0]-a[0])*k)+','+Math.round(a[1]+(b[1]-a[1])*k)+','+Math.round(a[2]+(b[2]-a[2])*k)+','+al+')';}
function light(t){return dawn?sm((t-2.6)/2.4):1;}
function bg(t){var k=light(t),g=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,Math.max(W,H)*0.75);g.addColorStop(0,mixc([22,40,92],[255,250,238],k));g.addColorStop(1,mixc([11,21,51],[236,225,200],k));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function glow(x,y,r,a){var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,236,170,'+a+')');g.addColorStop(.35,'rgba(232,170,50,'+(a*.5)+')');g.addColorStop(1,'rgba(232,170,50,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
/* Compass: the needle turns on its pin, searches, then settles on true north. After that it glides slowly toward the mouse, with no overshoot, and glides back to north when you stop. */
function compass(t,dt){
 var cx=W/2,cy=H*0.37,R=Math.min(W,H)*0.22,k=light(t),i,a;
 bg(t);
 var ink=mixc([200,210,240],[26,42,92],k);
 ctx.strokeStyle='#C8901F';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.stroke();
 ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R*0.9,0,6.2832);ctx.stroke();
 for(i=0;i<72;i++){a=i/72*6.2832;var l=i%18===0?0.14:(i%6===0?0.08:0.04);ctx.strokeStyle=i%18===0?'#C8901F':ink;ctx.lineWidth=i%18===0?2:1;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*R*0.9,cy+Math.sin(a)*R*0.9);ctx.lineTo(cx+Math.cos(a)*R*(0.9-l),cy+Math.sin(a)*R*(0.9-l));ctx.stroke();}
 for(i=0;i<8;i++){a=i*Math.PI/4-Math.PI/2;var L=i%2?R*0.42:R*0.7,w=R*0.07;ctx.fillStyle=i%2?mixa([110,150,240],[47,91,208],k,0.3):'rgba(200,144,31,0.3)';ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*L,cy+Math.sin(a)*L);ctx.lineTo(cx+Math.cos(a+1.5708)*w,cy+Math.sin(a+1.5708)*w);ctx.lineTo(cx-Math.cos(a+1.5708)*w,cy-Math.sin(a+1.5708)*w);ctx.closePath();ctx.fill();}
 ctx.fillStyle='#A86E14';ctx.font='300 '+Math.round(R*0.16)+'px Spectral, Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('N',cx,cy-R*1.13);
 if(t<2.6){
  st.tg=t<1.2?-2.3+0.05*Math.sin(t*9):-2.3+1.6*Math.sin((t-1.2)*3.2);
  st.v+=((st.tg-st.a)*30-st.v*5)*dt;st.a+=st.v*dt;
 } else {
  var rd=dt/SPEEDS[0];
  var fol=mx!==null&&performance.now()-lastMove<1400,want=fol?Math.atan2(my-cy,mx-cx):-Math.PI/2;
  st.tg+=Math.atan2(Math.sin(want-st.tg),Math.cos(want-st.tg))*Math.min(1,rd*1.5);
  var K=2.2,D=2*Math.sqrt(K);
  st.v+=((st.tg-st.a)*K-st.v*D)*rd;st.v=Math.max(-2.2,Math.min(2.2,st.v));st.a+=st.v*rd;
 }
 var c=Math.cos(st.a),s=Math.sin(st.a),NL=R*0.78,nw=R*0.075,px=-s,py=c;
 ctx.save();ctx.shadowColor='rgba(0,0,20,0.35)';ctx.shadowBlur=18;ctx.shadowOffsetY=10;
 var g=ctx.createLinearGradient(cx,cy,cx+c*NL,cy+s*NL);g.addColorStop(0,'#A86E14');g.addColorStop(1,'#F2CF72');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx+c*NL,cy+s*NL);ctx.lineTo(cx+px*nw,cy+py*nw);ctx.lineTo(cx-px*nw,cy-py*nw);ctx.closePath();ctx.fill();
 g=ctx.createLinearGradient(cx,cy,cx-c*NL,cy-s*NL);g.addColorStop(0,'#1B3C9E');g.addColorStop(1,'#4A78E8');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx-c*NL,cy-s*NL);ctx.lineTo(cx+px*nw,cy+py*nw);ctx.lineTo(cx-px*nw,cy-py*nw);ctx.closePath();ctx.fill();
 ctx.restore();
 var kk=Math.exp(-Math.pow((t-2.9)/0.5,2));glow(cx,cy,R*(0.12+0.5*kk),0.9);
 ctx.fillStyle='#C8901F';ctx.beginPath();ctx.arc(cx,cy,R*0.045,0,6.2832);ctx.fill();ctx.fillStyle='#FFF6DA';ctx.beginPath();ctx.arc(cx,cy,R*0.02,0,6.2832);ctx.fill();
}
/* Synapse: a signal runs a worn path (habit), pauses at one neuron, a new gold connection grows from it, sparks, and the signal takes the new way. */
var NODES=[];(function(){var s=17;function rn(){s=(s*16807)%2147483647;return s/2147483647;}for(var i=0;i<46;i++)NODES.push([0.04+0.92*rn(),0.06+0.6*rn()]);})();
var OLD=[[0.1,0.44],[0.29,0.36],[0.48,0.42],[0.67,0.5],[0.88,0.45]],NEW=[[0.1,0.44],[0.29,0.36],[0.48,0.42],[0.63,0.24],[0.84,0.14]];
function P(p,t,i){return [p[0]*W+Math.sin(t*0.7+i)*4,p[1]*H+Math.cos(t*0.6+i*1.3)*4];}
function ctrl(a,b){var dx=b[0]-a[0],dy=b[1]-a[1];return [(a[0]+b[0])/2-dy*0.12,(a[1]+b[1])/2+dx*0.12];}
function onCurve(a,b,u){var q=ctrl(a,b);return [(1-u)*(1-u)*a[0]+2*(1-u)*u*q[0]+u*u*b[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*q[1]+u*u*b[1]];}
function seg(a,b,frac,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);for(var j=1;j<=24;j++){var p=onCurve(a,b,j/24*frac);ctx.lineTo(p[0],p[1]);}ctx.stroke();}
function along(pts,u){var n=pts.length-1,f=Math.min(n-1e-6,Math.max(0,u*n)),i=Math.floor(f);return onCurve(pts[i],pts[i+1],f-i);}
function pulse(p){glow(p[0],p[1],22,0.95);ctx.fillStyle='#FFF6DA';ctx.beginPath();ctx.arc(p[0],p[1],3,0,6.2832);ctx.fill();}
function synapse(t,dt){
 bg(t);var k=light(t),i,j,q;
 var faint=mixa([140,170,255],[40,70,160],k,0.16),nodeCol=mixc([150,175,240],[47,91,208],k);
 var pts=NODES.map(function(n,i){return P(n,t,i);});
 for(i=0;i<pts.length;i++)for(j=i+1;j<pts.length;j++){if(Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1])<Math.min(W,H)*0.16)seg(pts[i],pts[j],1,faint,1);}
 pts.forEach(function(p){var near=mx!==null?Math.exp(-Math.pow(Math.hypot(p[0]-mx,p[1]-my)/120,2)):0;if(near>0.05)glow(p[0],p[1],30+30*near,0.7*near);ctx.fillStyle=nodeCol;ctx.beginPath();ctx.arc(p[0],p[1],2.5+2*near,0,6.2832);ctx.fill();});
 var O=OLD.map(function(n,i){return P(n,t,i+50);}),N=NEW.map(function(n,i){return P(n,t,i+50);});
 var grow=sm((t-3.2)/1.3),fade=sm((t-4.4)/1.5);
 for(i=0;i<4;i++){var after=i>=2,al=after?(0.85*(1-fade)+0.12):0.85;seg(O[i],O[i+1],1,mixa([120,160,255],[27,60,158],k,al.toFixed(3)),after?4*(1-fade)+1:4);}
 if(grow>0){seg(N[2],N[3],Math.min(1,grow*2),'rgba(200,144,31,0.95)',3.5);if(grow>0.5)seg(N[3],N[4],Math.min(1,(grow-0.5)*2),'rgba(200,144,31,0.95)',3.5);}
 var sp=Math.exp(-Math.pow((t-4.45)/0.35,2));if(sp>0.02){glow(N[3][0],N[3][1],80*sp+10,sp);glow(N[4][0],N[4][1],60*sp+10,sp*sm((t-4.3)/0.4));}
 if(t<2.4){for(q=0;q<2;q++)pulse(along(O,((t+q*0.8)/1.6)%1));}
 else if(t<4.6){var u=Math.min(0.5,(t-2.4)/1.2);pulse(along(O,u));if(u>=0.5)glow(O[2][0],O[2][1],30+20*(0.5+0.5*Math.sin(t*7)),0.6);}
 else{for(q=0;q<2;q++)pulse(along(N,((t-4.6+q*0.8)/1.6)%1));}
 [O[0],O[1],O[3],O[4]].forEach(function(p){ctx.fillStyle=nodeCol;ctx.beginPath();ctx.arc(p[0],p[1],5,0,6.2832);ctx.fill();});
 [N[3],N[4]].forEach(function(p){ctx.fillStyle='rgba(200,144,31,'+(0.25+0.75*grow).toFixed(3)+')';ctx.beginPath();ctx.arc(p[0],p[1],5.5,0,6.2832);ctx.fill();});
 ctx.fillStyle='#C8901F';ctx.beginPath();ctx.arc(O[2][0],O[2][1],7,0,6.2832);ctx.fill();
}
function size(){var d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}
function start(){t0=null;titles.classList.remove('on');st={a:-2.3,v:0,tg:-2.3};document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('sel',b.dataset.s==scene&&b.dataset.d==dawn);});}
function frame(now){if(t0===null){t0=now;last=now;}var SP=SPEEDS[scene],t=(now-t0)/1000*SP,dt=Math.min(0.05,(now-last)/1000)*SP;last=now;ctx.save();if(scene===0)compass(t,dt);else synapse(t,dt);ctx.restore();if(t>5.2)titles.classList.add('on');requestAnimationFrame(frame);}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){if(!b.dataset.r){scene=+b.dataset.s;dawn=+b.dataset.d;location.hash=scene*2+dawn+1;}start();};});
addEventListener('pointermove',function(e){lastMove=performance.now();mx=e.clientX;my=e.clientY;});
document.addEventListener('pointerleave',function(){mx=null;});
var h=Math.min(4,Math.max(1,parseInt(location.hash.slice(1))||1))-1;scene=h>>1;dawn=h&1;
size();addEventListener('resize',size);start();requestAnimationFrame(frame);
</script></body></html>
