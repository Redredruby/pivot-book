<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIVOT: weathervane</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Spectral:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;background:#0B1533}
canvas{position:fixed;inset:0;display:block}
.titles{position:fixed;left:0;right:0;bottom:7vh;text-align:center;pointer-events:none}
.titles>*{opacity:0;transform:translateY(12px);transition:opacity 1.6s ease,transform 1.6s ease}
.on>*{opacity:1;transform:none}.on .sub{transition-delay:.5s}.on .by{transition-delay:.9s}.on .fc{transition-delay:1.2s}
.pivot{font-family:Spectral,Georgia,serif;font-weight:300;font-size:clamp(56px,9vw,124px);letter-spacing:.16em;padding-left:.16em;line-height:1;margin:0;background:linear-gradient(100deg,#7A4E0E,#C8901F 35%,#E9B949 50%,#A86E14 70%,#7A4E0E);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:300;color:#1A2A5C;font-size:clamp(18px,2vw,26px);margin:.5em 0 .4em}
.by{color:#3A4670;font-size:15px;letter-spacing:.05em;margin:0}
.fc{color:#A86E14;font-size:12px;letter-spacing:.3em;margin:.8em 0 0}
#replay{position:fixed;top:16px;right:16px;font:500 14px "Hanken Grotesk",sans-serif;color:#1A2A5C;background:rgba(255,255,255,.7);border:1px solid rgba(168,110,20,.5);border-radius:999px;padding:8px 16px;cursor:pointer;z-index:5}
</style></head><body>
<canvas id="cv"></canvas>
<div class="titles" id="titles"><h1 class="pivot">PIVOT</h1><p class="sub">The Art of Moving Beyond Our Familiar Selves</p><p class="by">By Rebecca A. Tavangar</p><p class="fc">FORTHCOMING 2027</p></div>
<button id="replay">Replay</button>
<script>
/* Weathervane: at dusk the gold arrow points one way. The wind shifts, and the arrow swings slowly around on its pivot to meet it, settling as dawn breaks. */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),titles=document.getElementById('titles'),W,H,t0=null,last=0,streaks=[];
var Y0=2.6,Y1=0.25,S0=0.8,S1=3.6,VY=0.45,DEP=0.22;
function sm(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u);}
function eio(u){u=Math.max(0,Math.min(1,u));return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;}
function mixc(a,b,k){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*k)+','+Math.round(a[1]+(b[1]-a[1])*k)+','+Math.round(a[2]+(b[2]-a[2])*k)+')';}
function mixa(a,b,k,al){return 'rgba('+Math.round(a[0]+(b[0]-a[0])*k)+','+Math.round(a[1]+(b[1]-a[1])*k)+','+Math.round(a[2]+(b[2]-a[2])*k)+','+al+')';}
function size(){var d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);streaks=[];for(var i=0;i<7;i++)streaks.push({y:0.07+0.36*Math.random(),x:Math.random()*1.4-0.2,len:0.1+0.12*Math.random(),sp:0.04+0.05*Math.random(),ph:Math.random()*6.28});}
function poly(pts,fill){ctx.beginPath();pts.forEach(function(p,i){i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function frame(now){
 if(t0===null){t0=now;last=now;}var t=(now-t0)/1000,dt=Math.min(0.05,(now-last)/1000);last=now;
 var k=sm((t-0.8)/3.0),cx=W/2,S=Math.min(W,H)*0.18,py=H*0.28,ry=H*0.5;
 var cvv=Math.cos(VY),svv=Math.sin(VY);
 function pj(u,w,v,base){return [cx+u*cvv-w*svv,base-v-(u*svv+w*cvv)*DEP];}
 var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mixc([8,16,42],[246,240,226],k));g.addColorStop(0.6,mixc([28,46,100],[252,228,184],k));g.addColorStop(1,mixc([12,22,52],[240,226,196],k));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 var sg=ctx.createRadialGradient(cx,ry+S*0.7,0,cx,ry+S*0.7,H*0.7);sg.addColorStop(0,'rgba(240,180,70,'+(0.45*k).toFixed(3)+')');sg.addColorStop(1,'rgba(240,180,70,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
 var yaw=t<S0?Y0+0.03*Math.sin(t*1.2):Y0+(Y1-Y0)*eio((t-S0)/(S1-S0));
 if(t>S1)yaw+=0.04*Math.sin((t-S1)*0.9)*sm((t-S1)/1.5);
 var ca=Math.cos(yaw),sa=Math.sin(yaw);
 var face=Math.cos(yaw+VY),dir=-(face>=0?1:-1)*Math.min(1,Math.abs(face)*3);
 ctx.lineCap='round';
 streaks.forEach(function(s){s.x+=dir*s.sp*dt;if(s.x>1.25)s.x=-0.25;if(s.x<-0.25)s.x=1.25;var x0=s.x*W,y0=s.y*H,len=s.len*W*(dir>=0?1:-1);ctx.strokeStyle=mixa([200,215,255],[200,144,31],k,(0.25*Math.abs(dir)).toFixed(3));ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(x0+len*0.5,y0-6*Math.sin(t*0.8+s.ph),x0+len,y0);ctx.stroke();});
 var rg=ctx.createLinearGradient(0,ry,0,ry+S*0.75);rg.addColorStop(0,'#1A2A5C');rg.addColorStop(1,'rgba(26,42,92,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(cx,ry);ctx.lineTo(cx+S*1.7,ry+S*0.75);ctx.lineTo(cx-S*1.7,ry+S*0.75);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#A86E14';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,ry+2);ctx.lineTo(cx,py);ctx.stroke();
 var ay=py+(ry-py)*0.5,al=S*0.62,lc=mixc([235,205,145],[168,110,20],k);
 ctx.font='300 '+Math.round(S*0.17)+'px Spectral, Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';
 [['E',1,0],['W',-1,0],['N',0,1],['S',0,-1]].forEach(function(p){var a=pj(0,0,0,ay),b=pj(p[1]*al,p[2]*al,0,ay),c=pj(p[1]*al*1.25,p[2]*al*1.25,0,ay);ctx.strokeStyle='#C8901F';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.fillStyle=lc;ctx.fillText(p[0],c[0],c[1]);});
 function ap(d,v){return pj(d*ca,d*sa,v,py);}
 ctx.save();ctx.shadowColor='rgba(0,0,20,0.3)';ctx.shadowBlur=14;ctx.shadowOffsetY=8;
 var fg=ctx.createLinearGradient(0,py-S*0.4,0,py+S*0.2);fg.addColorStop(0,'#4A78E8');fg.addColorStop(1,'#1B3C9E');
 poly([ap(-S*0.5,0),ap(-S*0.78,S*0.34),ap(-S*1.02,S*0.34),ap(-S*0.86,0)],fg);
 poly([ap(-S*0.55,0),ap(-S*0.76,-S*0.18),ap(-S*0.98,-S*0.18),ap(-S*0.86,0)],fg);
 var a1=ap(-S*0.95,0),a2=ap(S*0.78,0);ctx.strokeStyle='#C8901F';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a1[0],a1[1]);ctx.lineTo(a2[0],a2[1]);ctx.stroke();
 var hg=ctx.createLinearGradient(cx-S,py,cx+S,py);hg.addColorStop(0,'#A86E14');hg.addColorStop(0.5,'#F2CF72');hg.addColorStop(1,'#A86E14');
 poly([ap(S*0.7,S*0.14),ap(S*1.04,0),ap(S*0.7,-S*0.14)],hg);
 ctx.restore();
 var on=sm((t-S1+0.2)/0.6);
 ctx.fillStyle='#C8901F';ctx.beginPath();ctx.arc(cx,py,S*0.055,0,6.2832);ctx.fill();
 ctx.fillStyle=mixc([238,214,160],[255,255,255],on);ctx.beginPath();ctx.arc(cx,py,S*0.024,0,6.2832);ctx.fill();
 if(t>S1+0.2)titles.classList.add('on');
 requestAnimationFrame(frame);
}
document.getElementById('replay').onclick=function(){t0=null;titles.classList.remove('on');};
size();addEventListener('resize',size);requestAnimationFrame(frame);
</script></body></html>
