<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIVOT: more opening ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Spectral:ital,wght@0,200;0,300;1,300&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #050A18; overflow: hidden; font-family: "Hanken Grotesk", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; display: block; }
  .scrim { position: fixed; left: 0; right: 0; bottom: 0; height: 50vh; background: linear-gradient(to top, rgba(4,8,22,0.94) 0%, rgba(4,8,22,0.75) 45%, rgba(4,8,22,0) 100%); pointer-events: none; }
  .titles { position: fixed; left: 0; right: 0; bottom: 13vh; text-align: center; pointer-events: none; }
  .pivot { font-family: Spectral, Georgia, serif; font-weight: 300; font-size: clamp(64px, 11vw, 150px); letter-spacing: 0.16em; padding-left: 0.16em; line-height: 1; margin: 0;
    background: linear-gradient(100deg, #8A5A12 0%, #E9B949 22%, #FFF1C4 38%, #D9A53A 52%, #9C6A18 70%, #F0C760 88%, #8A5A12 100%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.9)) drop-shadow(0 0 30px rgba(0,0,0,0.7));
    animation: shimmer 9s linear infinite; }
  @keyframes shimmer { to { background-position: -250% 0; } }
  .sub { font-family: Spectral, Georgia, serif; font-style: italic; font-weight: 300; color: #EADFC8; font-size: clamp(18px, 2vw, 28px); margin: 0.6em 0 0.5em; }
  .by { color: #C9BFA8; font-size: 15px; letter-spacing: 0.05em; margin: 0; }
  .fc { color: #D9A53A; font-size: 12px; letter-spacing: 0.3em; margin: 0.9em 0 0; }
  .titles > * { opacity: 0; transform: translateY(14px); transition: opacity 1.4s ease, transform 1.4s ease; }
  .on > * { opacity: 1; transform: none; }
  .own .pivot { display: none; }
  .on .sub { transition-delay: 0.5s; } .on .by { transition-delay: 0.9s; } .on .fc { transition-delay: 1.2s; }
  nav { position: fixed; top: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 5; flex-wrap: wrap; }
  nav button { font: 500 14px "Hanken Grotesk", sans-serif; color: #EADFC8; background: rgba(8,14,36,0.6); border: 1px solid rgba(217,165,58,0.5); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  nav button.sel { background: #D9A53A; color: #0A1230; border-color: #D9A53A; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="scrim"></div>
<div class="titles" id="titles">
  <h1 class="pivot">PIVOT</h1>
  <p class="sub">The Art of Moving Beyond Our Familiar Selves</p>
  <p class="by">By Rebecca A. Tavangar</p>
  <p class="fc">FORTHCOMING 2027</p>
</div>
<nav>
  <button data-i="0">4. The word turns</button>
  <button data-i="1">5. A door on its hinge</button>
  <button data-i="2">6. Kaleidoscope</button>
  <button data-i="r">Replay</button>
</nav>
<script>// Idea 4: The word turns. Each letter of PIVOT begins turned away, showing its blue back. One by one they
// pivot on their own axis to face you in gold. Afterward the letters near your mouse turn to follow it.
function Letters(ctx, W, H) {
  this.ownTitle = true;
  var size = Math.min(W * 0.2, H * 0.32), y0 = H * 0.42, word = 'PIVOT', L = [], tracking = size * 0.12;
  ctx.font = '300 ' + size + 'px Spectral, Georgia, serif';
  var widths = [], tot = 0; for (var i = 0; i < 5; i++) { widths.push(ctx.measureText(word[i]).width); tot += widths[i]; }
  tot += tracking * 4; var x = W / 2 - tot / 2;
  for (i = 0; i < 5; i++) { L.push({ ch: word[i], x: x + widths[i] / 2, w: widths[i], a: Math.PI, v: 0, target: Math.PI }); x += widths[i] + tracking; }
  var mx = -1e4, my = 0;
  this.move = function (x, y) { mx = x; my = y; };
  this.leave = function () { mx = -1e4; };
  function drawLetter(l, ang, reflect) {
    var c = Math.cos(ang), s = Math.sin(ang), front = c >= 0, depth = size * 0.09, layers = 16;
    ctx.save(); ctx.translate(l.x, y0);
    if (reflect) { ctx.translate(0, size * 0.78); ctx.scale(1, -0.55); ctx.globalAlpha = 0.16; }
    ctx.font = '300 ' + size + 'px Spectral, Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    for (var k = layers; k >= 1; k--) {
      var off = s * depth * k / layers;
      ctx.save(); ctx.translate(off, 0); ctx.scale(Math.max(0.02, Math.abs(c)) * (c < 0 ? -1 : 1), 1);
      var sh = 0.35 + 0.4 * (1 - k / layers);
      ctx.fillStyle = front ? 'rgb(' + (120 * sh + 40 | 0) + ',' + (80 * sh + 20 | 0) + ',' + (14 * sh | 0) + ')' : 'rgb(' + (12 * sh | 0) + ',' + (34 * sh + 8 | 0) + ',' + (110 * sh + 30 | 0) + ')';
      ctx.fillText(l.ch, 0, size * 0.33); ctx.restore();
    }
    ctx.save(); ctx.scale(Math.max(0.02, Math.abs(c)) * (c < 0 ? -1 : 1), 1);
    var g = ctx.createLinearGradient(-size * 0.4, -size * 0.6, size * 0.4, size * 0.4), lit = 0.55 + 0.45 * Math.abs(c);
    if (front) { g.addColorStop(0, '#FFF0C0'); g.addColorStop(0.35, '#ECB948'); g.addColorStop(0.7, '#B07A1C'); g.addColorStop(1, '#F2CC6A'); }
    else { g.addColorStop(0, '#8FB4FF'); g.addColorStop(0.4, '#2F5BD0'); g.addColorStop(1, '#0E1F66'); }
    ctx.globalAlpha *= lit; ctx.fillStyle = g; ctx.fillText(l.ch, 0, size * 0.33); ctx.restore();
    ctx.restore();
  }
  this.draw = function (t, dt) {
    var bg = ctx.createRadialGradient(W / 2, y0, 0, W / 2, y0, Math.max(W, H) * 0.7);
    bg.addColorStop(0, '#132656'); bg.addColorStop(0.6, '#081230'); bg.addColorStop(1, '#030714');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    var fl = ctx.createRadialGradient(W / 2, y0 + size * 0.5, 0, W / 2, y0 + size * 0.5, W * 0.5); fl.addColorStop(0, 'rgba(233,180,66,0.10)'); fl.addColorStop(1, 'rgba(233,180,66,0)');
    ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < 5; i++) {
      var l = L[i], turnAt = 1.0 + i * 0.32, base = t > turnAt ? 0 : Math.PI;
      var near = 0;
      if (t > 3.6 && mx > -1e3) { var d = Math.abs(mx - l.x) / (size * 0.8); near = Math.exp(-d * d) * Math.exp(-Math.pow((my - y0) / (size * 1.2), 2)); }
      l.target = base + near * Math.PI * 1.0 * (mx > l.x ? 1 : -1) + (t > 4 ? 0.12 * Math.sin(t * 0.8 + i * 0.9) : 0);
      l.v += ((l.target - l.a) * 26 - l.v * 4.2) * dt; l.a += l.v * dt;
    }
    for (i = 0; i < 5; i++) drawLetter(L[i], L[i].a, true);
    for (i = 0; i < 5; i++) drawLetter(L[i], L[i].a, false);
    var fp = Math.min(1, Math.max(0, (t - 2.6) / 1.2));
    if (fp > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; var g = ctx.createRadialGradient(W / 2, y0, 0, W / 2, y0, size * 2.6); g.addColorStop(0, 'rgba(255,210,120,' + 0.12 * fp + ')'); g.addColorStop(1, 'rgba(255,210,120,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  };
}
</script>
<script>// Idea 5: A door on its hinge. In a dark blue room a door turns on its hinge, and gold light spills
// across the floor toward you. After it opens, your mouse moves the door: further right, wider open.
function Door(ctx, W, H) {
  var dh = H * 0.4, dw = Math.min(dh / 2.05, W * 0.28), x0 = W / 2 - dw / 2, x1 = W / 2 + dw / 2, y1 = H * 0.53, y0t = y1 - dh;
  var ang = 0, v = 0, target = 0, mx = null;
  this.move = function (x) { mx = x; };
  this.leave = function () { mx = null; };
  function sm(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
  this.draw = function (t, dt) {
    target = t < 1.6 ? 0.04 * Math.sin(t * 4) * sm(t) : (mx !== null && t > 4.2 ? 0.35 + 1.0 * Math.max(0, Math.min(1, mx / W)) : 1.05);
    v += ((target - ang) * 9 - v * 3.2) * dt; ang += v * dt;
    var open = Math.max(0, Math.sin(ang)), c = Math.cos(ang);
    // room
    var wall = ctx.createLinearGradient(0, 0, 0, y1); wall.addColorStop(0, '#050B1E'); wall.addColorStop(1, '#0C1A42');
    ctx.fillStyle = wall; ctx.fillRect(0, 0, W, y1);
    var floor = ctx.createLinearGradient(0, y1, 0, H); floor.addColorStop(0, '#0A1534'); floor.addColorStop(1, '#03060F');
    ctx.fillStyle = floor; ctx.fillRect(0, y1, W, H - y1);
    ctx.strokeStyle = 'rgba(120,150,230,0.08)'; ctx.lineWidth = 1;
    for (var i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * dw * 0.25, y1); ctx.lineTo(W / 2 + i * W * 0.16, H); ctx.stroke(); }
    // light behind the door, and the glow it throws on the wall
    var glowA = 0.15 + 0.85 * open;
    var gw = ctx.createRadialGradient(W / 2, y1 - dh * 0.5, 0, W / 2, y1 - dh * 0.5, dh * 1.6);
    gw.addColorStop(0, 'rgba(255,200,100,' + 0.35 * glowA + ')'); gw.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gw; ctx.fillRect(0, 0, W, H); ctx.restore();
    var li = ctx.createLinearGradient(0, y0t, 0, y1); li.addColorStop(0, '#FFE7A6'); li.addColorStop(1, '#FFF6DA');
    ctx.fillStyle = li; ctx.fillRect(x0, y0t, dw, dh);
    // light spilling across the floor toward the viewer
    var xe = x0 + dw * c, p = 1 + 0.38 * open;
    var lx = Math.max(xe, x0), sx0 = lx + (lx - W / 2) * 3.2, sx1 = x1 + (x1 - W / 2) * 3.2 + W * 0.25 * open;
    var sp = ctx.createLinearGradient(0, y1, 0, H); sp.addColorStop(0, 'rgba(255,214,120,' + 0.75 * open + ')'); sp.addColorStop(1, 'rgba(255,190,80,' + 0.05 * open + ')');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = sp; ctx.beginPath(); ctx.moveTo(lx, y1); ctx.lineTo(x1, y1); ctx.lineTo(sx1, H); ctx.lineTo(sx0, H); ctx.closePath(); ctx.fill(); ctx.restore();
    // frame
    ctx.strokeStyle = '#D9A53A'; ctx.lineWidth = 3; ctx.strokeRect(x0 - 2, y0t - 2, dw + 4, dh + 2);
    // the door itself, swinging toward us on its left hinge
    var ym = y1 - dh / 2, eh = dh / 2 * p;
    var dg = ctx.createLinearGradient(x0, 0, xe, 0); dg.addColorStop(0, '#1B3C9E'); dg.addColorStop(1, c > 0.3 ? '#2E5BD6' : '#132C7A');
    ctx.fillStyle = dg; ctx.beginPath(); ctx.moveTo(x0, y0t); ctx.lineTo(xe, ym - eh); ctx.lineTo(xe, ym + eh); ctx.lineTo(x0, y1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,214,120,' + (0.4 + 0.6 * open) + ')'; ctx.lineWidth = 2 + 3 * open; ctx.beginPath(); ctx.moveTo(xe, ym - eh); ctx.lineTo(xe, ym + eh); ctx.stroke();
    // panels on the door
    ctx.strokeStyle = 'rgba(233,180,66,0.55)'; ctx.lineWidth = 1.5;
    for (var r = 0; r < 2; r++) { var a0 = 0.18, a1 = 0.82, b0 = r ? 0.55 : 0.1, b1 = r ? 0.92 : 0.45;
      function P(u, w) { var xx = x0 + (xe - x0) * u, hh = (dh / 2) * (1 + (p - 1) * u); return [xx, ym - hh + 2 * hh * w]; }
      var q = [P(a0, b0), P(a1, b0), P(a1, b1), P(a0, b1)]; ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]); for (var k = 1; k < 4; k++) ctx.lineTo(q[k][0], q[k][1]); ctx.closePath(); ctx.stroke(); }
    var hk = ctx.createRadialGradient(x0, y1 - dh * 0.5, 0, x0, y1 - dh * 0.5, 8); hk.addColorStop(0, 'rgba(255,248,220,1)'); hk.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = hk; ctx.beginPath(); ctx.arc(x0, y1 - dh * 0.5, 8, 0, 7); ctx.fill();
  };
}
</script>
<script>// Idea 6: A kaleidoscope of gold and blue glass. Every piece turns around one centre point; at the pivot
// the turning reverses and the pieces come into a new pattern. Your mouse turns the whole view.
function Kaleido(ctx, W, H) {
  var cx = W / 2, cy = H * 0.44, R = Math.hypot(W, H) * 0.6, N = 12, seg = Math.PI * 2 / N, shards = [], s = 11, rot = 0, mrot = 0, tm = 0;
  function rn() { s = (s * 16807) % 2147483647; return s / 2147483647; }
  var cols = ['#F2C14E', '#C88A1E', '#FFE7A0', '#2E5BD6', '#13308F', '#6E9BFF', '#0B1A55'];
  for (var i = 0; i < 26; i++) {
    var n = 3 + (rn() * 3 | 0), pts = [], r0 = 30 + rn() * R * 0.55, a0 = rn() * seg, sz = 25 + rn() * 90;
    for (var k = 0; k < n; k++) { var a = k / n * 6.2832 + rn() * 0.6; pts.push([Math.cos(a) * sz * (0.6 + 0.6 * rn()), Math.sin(a) * sz * (0.6 + 0.6 * rn())]); }
    shards.push({ r: r0, a: a0, spin: rn() * 6.28, vs: (rn() - 0.5) * 1.2, dr: (rn() - 0.5) * 0.25, pts: pts, c: cols[(rn() * cols.length) | 0], al: 0.55 + 0.4 * rn() });
  }
  this.move = function (x) { mrot = (x / W - 0.5) * 1.4; };
  this.leave = function () { mrot = 0; };
  function sm(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
  this.draw = function (t, dt) {
    var dir = 1 - 2 * sm((t - 2.4) / 1.2);
    rot += dir * 0.35 * dt; tm += (mrot - tm) * Math.min(1, dt * 2);
    ctx.fillStyle = '#040A1C'; ctx.fillRect(0, 0, W, H);
    for (var m = 0; m < N; m++) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate((m % 2 ? m + 1 : m) * seg + rot * 0.3 + tm); if (m % 2) ctx.scale(1, -1);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -0.002, seg + 0.002); ctx.closePath(); ctx.clip();
      for (var i = 0; i < shards.length; i++) {
        var sh = shards[i], a = sh.a + rot * sh.dr * 4, r = sh.r * (0.85 + 0.15 * Math.sin(t * 0.6 + i));
        var x = Math.cos(a) * r, y = Math.sin(a) * r;
        ctx.save(); ctx.translate(x, y); ctx.rotate(sh.spin + rot * sh.vs);
        ctx.globalAlpha = sh.al; ctx.fillStyle = sh.c; ctx.beginPath(); ctx.moveTo(sh.pts[0][0], sh.pts[0][1]);
        for (var k = 1; k < sh.pts.length; k++) ctx.lineTo(sh.pts[k][0], sh.pts[k][1]); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 0.9; ctx.strokeStyle = 'rgba(255,226,150,0.7)'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
      }
      ctx.restore();
    }
    var vg = ctx.createRadialGradient(cx, cy, R * 0.25, cx, cy, R * 0.95); vg.addColorStop(0, 'rgba(4,10,28,0)'); vg.addColorStop(1, 'rgba(4,10,28,0.85)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    var k2 = Math.exp(-Math.pow((t - 2.4) / 0.5, 2)), g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30 + 90 * k2);
    g.addColorStop(0, 'rgba(255,250,230,1)'); g.addColorStop(0.2, 'rgba(255,214,120,' + (0.5 + 0.4 * k2) + ')'); g.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 30 + 90 * k2, 0, 7); ctx.fill();
  };
}
</script>
<script>
(function () {
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), titles = document.getElementById('titles');
  var makers = [Letters, Door, Kaleido], cur = 0, scene, t0, last, W, H;
  var q = location.hash.match(/(\d)/); if (q) cur = Math.min(2, +q[1] - 1);
  function start() {
    var dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scene = new makers[cur](ctx, W, H); t0 = null; titles.classList.remove('on'); titles.classList.toggle('own', !!scene.ownTitle);
    document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('sel', b.dataset.i == cur); });
  }
  function frame(now) {
    if (t0 === null) { t0 = now; last = now; }
    var t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
    scene.draw(t, dt);
    if (t > 4.6) titles.classList.add('on');
    requestAnimationFrame(frame);
  }
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { if (b.dataset.i !== 'r') { cur = +b.dataset.i; location.hash = cur + 1; } start(); });
  });
  addEventListener('pointermove', function (e) { scene.move(e.clientX, e.clientY); });
  document.addEventListener('pointerleave', function () { scene.leave(); });
  addEventListener('resize', start);
  var go = false; function begin() { if (go) return; go = true; start(); requestAnimationFrame(frame); }
  if (document.fonts && document.fonts.load) document.fonts.load('300 100px Spectral').then(begin, begin); setTimeout(begin, 1200);
})();
</script>
</body>
</html>
